<!--
  BUG-003 — same recovery for the manager (sidebar, docs pages).

  Storybook's static build code-splits one chunk per story file and names it
  with a content hash, so every build produces new filenames. A tab holds the
  shell it loaded and only fetches a story's chunk when you navigate to it, so
  once the production alias moves to a newer deployment every lazy import 404s
  and the preview shows "Failed to fetch dynamically imported module". Nothing
  is wrong with the build; the client is simply on an older one.

  The manager lazy-loads too — docs pages and the story index. Same event, same
  recovery, and the URL carries the current story so a reload lands back in
  place. Kept as a separate file because Storybook injects the two documents
  independently; they are deliberately identical.

  Vercel's Skew Protection solves this at the platform level, but only
  automatically for frameworks it supports. This is a plain static build, so it
  would need the deployment ID threaded onto every asset URL at build time. See
  BUG-003 for that option; this handler is the self-contained half and works on
  any host.
-->
<script>
  (function () {
    var KEY = 'sb-preload-recovered-at'
    var COOLDOWN_MS = 15000

    window.addEventListener('vite:preloadError', function (event) {
      var now = Date.now()
      var last = 0
      try {
        last = parseInt(sessionStorage.getItem(KEY) || '0', 10)
      } catch (e) {
        /* storage blocked — fall through and allow one reload */
      }

      // A genuinely missing chunk would reload forever. One recovery per
      // cooldown means a real 404 surfaces the error instead of looping,
      // while a second deploy later in the same session still recovers.
      if (now - last < COOLDOWN_MS) return

      try {
        sessionStorage.setItem(KEY, String(now))
      } catch (e) {
        /* ignore */
      }

      event.preventDefault()
      window.location.reload()
    })
  })()
</script>
